name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (lint, migrate, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev,postgres]"
      - name: Lint
        run: ruff check forge tests
      - name: Migrations apply and reverse (Postgres)
        env:
          FORGE_DATABASE_URL: postgresql+psycopg://forge:forge@localhost:5432/forge
        run: |
          alembic upgrade head
          alembic downgrade base
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (Postgres)
        env:
          FORGE_DATABASE_URL: postgresql+psycopg://forge:forge@localhost:5432/forge
          FORGE_SECRET_KEY: ci-secret-key-longenough-1234567890abcdef
        run: pytest -q

  frontend:
    name: Frontend (type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
