# Local development services for Forge.
#
# The Forge control plane defaults to SQLite for zero-config local runs and tests,
# but production and realistic development use PostgreSQL. This compose file provides
# a Postgres instance matching the default FORGE_DATABASE_URL below.
#
#   docker compose up -d db
#   export FORGE_DATABASE_URL=postgresql+psycopg://forge:forge@localhost:5432/forge

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    volumes:
      - forge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  forge_pgdata:
